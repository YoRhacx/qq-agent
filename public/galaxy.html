  function meterRow(label, value, display) {
    var row = make('div', 'meter-row');
    row.appendChild(make('span', '', label));
    var track = make('div', 'meter-track');
    var fill = make('div', 'meter-fill');
    fill.style.width = pct(value) + '%';
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(make('span', 'meter-val', display));
    return row;
  }

  function renderPanel() {
    if (state.selectedId) {
      var node = state.nodeById.get(state.selectedId);
      if (node) { renderDetail(node); return; }
      state.selectedId = null;
    }
    renderEmotionPanel();
  }

  function selectNode(id, fly) {
    var node = state.nodeById.get(String(id));
    if (!node) return;
    if (!state.filters.has(node.kind)) {
      state.filters.add(node.kind);
      for (var i = 0; i < state.nodes.length; i++) state.nodes[i]._shown = state.filters.has(state.nodes[i].kind);
      syncFilterUI();
      updateCounts();
      updateEmpty();
    }
    state.selectedId = node.id;
    cam.lastInput = performance.now();
    if (fly) focusOnNode(node, { zoom: Math.max(1.12, Math.min(1.45, cam.zoom)) });
    renderPanel();
    hideTip();
  }

  function clearSelection() {
    state.selectedId = null;
    state.hoverId = null;
    renderPanel();
  }

  function focusOnNode(node, opts) {
    opts = opts || {};
    var rxy = Math.hypot(node.x, node.z);
    var yaw = -Math.atan2(node.x, node.z === 0 ? 0.00001 : node.z);
    var pitch = Math.atan2(node.y, rxy);
    cam.tYaw = nearestAngle(cam.yaw, yaw);
    cam.tPitch = clamp(pitch, -1.22, 1.22);
    if (opts.zoom) cam.tZoom = clamp(opts.zoom, 0.45, 3.2);
    cam.lastInput = performance.now();
  }

  /* ------------------------------------------------------------------ */
  /* bootstrap (events + renderer appended below)                       */
  /* ------------------------------------------------------------------ */

  /* ------------------------------------------------------------------ */
  /* renderer                                                           */
  /* ------------------------------------------------------------------ */

  function radialSprite(rgb) {
    var size = 128;
    var c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    var g = c.getContext('2d');
    var grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(' + rgb + ',1)');
    grad.addColorStop(0.15, 'rgba(' + rgb + ',.62)');
    grad.addColorStop(0.42, 'rgba(' + rgb + ',.17)');
    grad.addColorStop(0.72, 'rgba(' + rgb + ',.035)');
    grad.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return c;
  }

  function buildSprites() {
    sprites = Object.create(null);
    var keys = Object.keys(KINDS);
    for (var i = 0; i < keys.length; i++) sprites[keys[i]] = radialSprite(KINDS[keys[i]].rgb);
    coreSprite = radialSprite('148,192,255');
  }

  function nebulaBlob(g, x, y, r, color) {
    var grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, color);
    grad.addColorStop(0.55, color.replace(/[\d.]+\)$/, '0.04)'));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }

  function buildNebula() {
    if (!view.w || !view.h) { nebula = null; return; }
    var scale = 0.5;
    var c = document.createElement('canvas');
    c.width = Math.max(32, Math.round(view.w * scale));
    c.height = Math.max(32, Math.round(view.h * scale));
    var g = c.getContext('2d');
    var w = c.width, h = c.height;
    var cx = view.cx * scale, cy = view.cy * scale;
    var m = Math.min(w, h);
    g.fillStyle = '#05070f';
    g.fillRect(0, 0, w, h);
    var base = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.9);
    base.addColorStop(0, 'rgba(25,40,84,.52)');
    base.addColorStop(0.36, 'rgba(12,20,44,.4)');
    base.addColorStop(1, 'rgba(3,5,13,0)');
    g.fillStyle = base;
    g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'lighter';
    nebulaBlob(g, cx + m * 0.05, cy - m * 0.02, m * 1.02, 'rgba(66,104,255,.115)');
    nebulaBlob(g, cx + m * 0.72, cy - m * 0.38, m * 0.66, 'rgba(142,72,226,.075)');
    nebulaBlob(g, cx - m * 0.78, cy + m * 0.3, m * 0.62, 'rgba(32,160,212,.05)');
    nebulaBlob(g, cx + m * 0.5, cy + m * 0.7, m * 0.58, 'rgba(235,80,155,.035)');
    nebulaBlob(g, cx - m * 0.1, cy - m * 0.05, m * 0.36, 'rgba(150,200,255,.045)');
    g.globalCompositeOperation = 'source-over';
    nebula = c;
  }

  function buildStars() {
    stars = [];
    var count = Math.min(340, Math.round(view.w * view.h / 5200));
    for (var i = 0; i < count; i++) {
      var r = Math.random();
      stars.push({
        x: Math.random() * view.w,
        y: Math.random() * view.h,
        size: r < 0.82 ? 0.7 : (r < 0.965 ? 1.15 : 1.7),
        alpha: 0.15 + Math.random() * 0.55,
        speed: 0.35 + Math.random() * 1.7,
        phase: Math.random() * TAU,
        depth: 0.25 + Math.random() * 0.75,
        cross: r > 0.968
      });
    }
  }

  function buildDust() {
    dust = [];
    for (var i = 0; i < 64; i++) {
      dust.push({
        angle: Math.random() * TAU,
        radius: 0.06 + Math.random() * 0.68,
        speed: (0.03 + Math.random() * 0.09) * (Math.random() < 0.5 ? -1 : 1),
        size: 0.5 + Math.random() * 1.4,
        phase: Math.random() * TAU,
        alpha: 0.12 + Math.random() * 0.3
      });
    }
  }

  function resize() {
    view.w = Math.max(1, window.innerWidth);
    view.h = Math.max(1, window.innerHeight);
    view.dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    dom.canvas.width = Math.max(1, Math.round(view.w * view.dpr));
    dom.canvas.height = Math.max(1, Math.round(view.h * view.dpr));
    dom.canvas.style.width = view.w + 'px';
    dom.canvas.style.height = view.h + 'px';
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    var pr = dom.panel.getBoundingClientRect();
    view.desktop = view.w > 980 && pr.left > view.w * 0.45;
    view.cx = view.desktop ? pr.left / 2 : view.w / 2;
    view.cy = view.h * (view.desktop ? 0.47 : 0.4);
    view.panelLeft = view.desktop ? pr.left : view.w;
    document.documentElement.style.setProperty('--stage-cx', Math.round(view.cx) + 'px');
    if (dom.mascot) { if (dom.mascot.classList.contains('placed')) restoreMascot(); else measureMascot(); }
    buildNebula();
    buildStars();
    buildDust();
  }

  function drawOrbits() {
    var R = Math.min(view.w, view.h) * 0.43;
    ctx.save();
    ctx.strokeStyle = 'rgba(110,160,255,.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(view.cx, view.cy, R, R * 0.44, -0.22, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(140,180,255,.03)';
    ctx.beginPath();
    ctx.ellipse(view.cx, view.cy, R * 0.72, R * 0.3, 0.18, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  function drawBackground(t) {
    if (!nebula) return;
    ctx.drawImage(nebula, 0, 0, view.w, view.h);
    drawOrbits();
    var ox = Math.sin(cam.yaw * 0.75) * 9;
    var oy = Math.cos(cam.pitch * 0.8) * 5;
    var w = view.w, h = view.h;
    ctx.fillStyle = '#cfe0ff';
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var x = s.x + ox * s.depth;
      var y = s.y + oy * s.depth;
      if (x < 0) x += w; else if (x >= w) x -= w;
      if (y < 0) y += h; else if (y >= h) y -= h;
      var tw = 0.52 + 0.48 * Math.sin(t * s.speed + s.phase);
      ctx.globalAlpha = s.alpha * tw;
      ctx.fillRect(x, y, s.size, s.size);
      if (s.cross) {
        ctx.globalAlpha = s.alpha * tw * 0.35;
        ctx.fillRect(x - 2.2, y + s.size * 0.4, 5.2, 0.55);
        ctx.fillRect(x + s.size * 0.4, y - 2.2, 0.55, 5.2);
      }
    }
    ctx.fillStyle = '#8fc8ff';
    var R = Math.min(view.w, view.h) * 0.47;
    var dim = state.nodes.length ? 0.58 : 1;
    for (var j = 0; j < dust.length; j++) {
      var p = dust[j];
      var ang = p.angle + t * p.speed;
      var dx = view.cx + Math.cos(ang) * p.radius * R * 1.12;
      var dy = view.cy + Math.sin(ang) * p.radius * R * 0.74;
      var a = p.alpha * (0.4 + 0.6 * Math.sin(t * 0.8 + p.phase));
      if (a <= 0.01) continue;
      ctx.globalAlpha = a * dim;
      ctx.fillRect(dx, dy, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    if (coreSprite) {
      var gs = Math.min(view.w, view.h) * 0.58;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = state.nodes.length ? 0.15 : 0.34;
      ctx.drawImage(coreSprite, view.cx - gs / 2, view.cy - gs / 2, gs, gs);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
  }

  function projectAll() {
    var sinY = Math.sin(cam.yaw), cosY = Math.cos(cam.yaw);
    var sinP = Math.sin(cam.pitch), cosP = Math.cos(cam.pitch);
    var world = Math.min(view.w, view.h) * 1.02 * cam.zoom;
    var w = view.w, h = view.h;
    var floating = state.nodes.length <= 120 && !REDUCED && !state.loading;
    var searching = !!state.searchQuery;
    for (var i = 0; i < state.nodes.length; i++) {
      var n = state.nodes[i];
      var rx = n.x * cosY + n.z * sinY;
      var rz = -n.x * sinY + n.z * cosY;
      var ry = n.y * cosP - rz * sinP;
      var rz2 = n.y * sinP + rz * cosP;
      var persp = FOCAL / (FOCAL + CAM_DIST - rz2);
      var sc = world * persp;
      var sx = view.cx + rx * sc;
      var sy = view.cy - ry * sc;
      if (floating) {
        sx += Math.sin(elapsed * 0.55 + n.seed) * 1.8;
        sy += Math.cos(elapsed * 0.43 + n.seed * 1.27) * 2.2;
      }
      n._sx = sx;
      n._sy = sy;
      n._z = rz2;
      n._scale = persp;
      var baseR = 1.0 + Math.sqrt(n.importance) * 3.7 + Math.min(1.8, Math.log10(n.accessCount + 1) * 0.9);
      n._r = baseR * (0.78 + persp * 0.3);
      var baseA = 0.52 + Math.log10(n.accessCount + 1) * 0.15;
      var depth = 0.64 + 0.36 * ((rz2 + 1) / 2);
      n._a = clamp(baseA * depth, 0.35, 0.98);
      if (n._match) n._a = Math.min(1, n._a + 0.08);
      else if (searching) n._a *= 0.16;
      if (n.id === state.hoverId) {
        n._r += 1.4;
        n._a = 1;
      }
      if (n.id === state.selectedId) {
        n._r += 2.2;
        n._a = 1;
      }
      n._vis = n._shown && sx > -40 && sx < w + 40 && sy > -40 && sy < h + 40;
    }
  }

  function drawLinks() {
    if (!state.links.length) return;
    var many = state.nodes.length > 200;
    var base = many ? 0.038 : (state.nodes.length > 100 ? 0.056 : 0.08);
    var lineW = many ? 0.55 : 0.75;
    ctx.lineCap = 'round';
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = lineW;
    var i, a, b;
    ctx.strokeStyle = 'rgba(106,164,255,' + (base * 1.55).toFixed(3) + ')';
    ctx.beginPath();
    var any = false;
    for (i = 0; i < state.links.length; i++) {
      var link = state.links[i];
      if (link.weight < 0.5) continue;
      a = link._a;
      b = link._b;
      if (!a || !b || !a._vis || !b._vis) continue;
      ctx.moveTo(a._sx, a._sy);
      ctx.lineTo(b._sx, b._sy);
      any = true;
    }
    if (any) ctx.stroke();
    ctx.strokeStyle = 'rgba(118,150,230,' + base.toFixed(3) + ')';
    ctx.beginPath();
    any = false;
    for (i = 0; i < state.links.length; i++) {
      var link2 = state.links[i];
      if (link2.weight >= 0.5) continue;
      a = link2._a;
      b = link2._b;
      if (!a || !b || !a._vis || !b._vis) continue;
      ctx.moveTo(a._sx, a._sy);
      ctx.lineTo(b._sx, b._sy);
      any = true;
    }
    if (any) ctx.stroke();
    if (state.selectedId) {
      var rel = state.linksByNode.get(state.selectedId) || [];
      ctx.strokeStyle = 'rgba(156,222,255,.32)';
      ctx.lineWidth = 1.05;
      ctx.beginPath();
      var drew = false;
      for (i = 0; i < rel.length; i++) {
        a = rel[i]._a;
        b = rel[i]._b;
        if (!a || !b || !a._vis || !b._vis) continue;
        ctx.moveTo(a._sx, a._sy);
        ctx.lineTo(b._sx, b._sy);
        drew = true;
      }
      if (drew) ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  function drawNodes(t) {
    var order = [];
    for (var i = 0; i < state.nodes.length; i++) if (state.nodes[i]._vis) order.push(state.nodes[i]);
    if (!order.length) return;
    order.sort(function (a, b) { return a._z - b._z; });
    ctx.globalCompositeOperation = 'lighter';
    for (var j = 0; j < order.length; j++) {
      var n = order[j];
      var sprite = sprites[n.kind] || sprites.other;
      if (!sprite) continue;
      var gs = n._r * 5.4;
      ctx.globalAlpha = n._a * 0.34;
      ctx.drawImage(sprite, n._sx - gs / 2, n._sy - gs / 2, gs, gs);
    }
    ctx.globalCompositeOperation = 'source-over';
    for (var k = 0; k < order.length; k++) {
      var node = order[k];
      var def = kindDef(node.kind);
      ctx.globalAlpha = node._a;
      ctx.fillStyle = def.color;
      ctx.beginPath();
      ctx.arc(node._sx, node._sy, node._r, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = Math.min(1, node._a * 0.95);
      ctx.fillStyle = '#f1fbff';
      ctx.beginPath();
      ctx.arc(node._sx, node._sy, Math.max(0.6, node._r * 0.34), 0, TAU);
      ctx.fill();
    }
    var matchCount = state.matches.size;
    for (var m = 0; m < order.length; m++) {
      var n2 = order[m];
      if (n2._match && n2.id !== state.selectedId && (matchCount <= 80 || n2.importance > 0.6)) {
        ctx.globalAlpha = 0.32 + 0.18 * Math.sin(t * 2.1 + n2.seed);
        ctx.strokeStyle = '#ffd28a';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.arc(n2._sx, n2._sy, n2._r + 4.2, 0, TAU);
        ctx.stroke();
      }
      if (n2.id === state.hoverId && n2.id !== state.selectedId) {
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = 'rgba(228,244,255,.9)';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.arc(n2._sx, n2._sy, n2._r + 7.5, 0, TAU);
        ctx.stroke();
      }
    }
    var sel = state.selectedId ? state.nodeById.get(state.selectedId) : null;
    if (sel && sel._vis && sel._shown) {
      var pulse = 0.5 + 0.5 * Math.sin(t * 2.3);
      ctx.globalAlpha = 0.55 + pulse * 0.3;
      ctx.strokeStyle = 'rgba(180,235,255,.95)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(sel._sx, sel._sy, sel._r + 9, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 0.34 + pulse * 0.2;
      ctx.strokeStyle = 'rgba(160,210,255,.7)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 5]);
      ctx.lineDashOffset = -t * 10;
      ctx.beginPath();
      ctx.arc(sel._sx, sel._sy, sel._r + 16, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.65;
      ctx.beginPath();
      for (var q = 0; q < 4; q++) {
        var ang = q * Math.PI / 2;
        var r1 = sel._r + 12;
        var r2 = sel._r + 18;
        ctx.moveTo(sel._sx + Math.cos(ang) * r1, sel._sy + Math.sin(ang) * r1);
        ctx.lineTo(sel._sx + Math.cos(ang) * r2, sel._sy + Math.sin(ang) * r2);
      }
      ctx.strokeStyle = 'rgba(190,235,255,.7)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'none';
  }

  function drawLabels(t) {
    var chosen = [];
    var seen = Object.create(null);
    function add(n) {
      if (!n || !n._vis || !n._shown || seen[n.id]) return;
      seen[n.id] = true;
      chosen.push(n);
    }
    add(state.selectedId ? state.nodeById.get(state.selectedId) : null);
    add(state.hoverId ? state.nodeById.get(state.hoverId) : null);
    if (state.searchList.length) add(state.searchList[0]);
    for (var i = 0; i < state.labelNodes.length; i++) add(state.labelNodes[i]);
    if (!chosen.length) return;
    ctx.save();
    ctx.font = '500 11px "Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.9)';
    ctx.shadowBlur = 7;
    ctx.shadowOffsetY = 1;
    var boxes = [];
    // 立绘能被拖到任意位置，所以避让用它当前的屏幕矩形（mascotBox），不再按固定角落算
    var mbox = mascotBox;
    for (var j = 0; j < chosen.length; j++) {
      var n = chosen[j];
      var sel = n.id === state.selectedId;
      var hov = n.id === state.hoverId;
      var forced = sel || hov;
      var label = shortText(n.text, forced ? 22 : 18);
      if (!label) continue;
      var x = n._sx;
      var y = n._sy + n._r + 13;
      if (y > view.h - 26) y = n._sy - n._r - 12;
      var xmax = view.panelLeft < view.w ? view.panelLeft - 68 : view.w - 60;
      if (x > xmax) x = xmax;
      if (x < 55) x = 55;
      /* keep ambient labels clear of the mascot's silhouette */
      if (!forced && mbox && x > mbox.left - 14 && x < mbox.right + 14 && y > mbox.top - 10 && y < mbox.bottom + 10) continue;
      var half = ctx.measureText(label).width / 2 + 7;
      var box = { l: x - half, r: x + half, t: y - 9, b: y + 9 };
      var hits = false;
      for (var k = 0; k < boxes.length; k++) {
        var o = boxes[k];
        if (box.l < o.r && box.r > o.l && box.t < o.b && box.b > o.t) { hits = true; break; }
      }
      if (hits && !forced) continue;
      boxes.push(box);
      ctx.globalAlpha = sel ? 0.98 : (hov ? 0.94 : 0.7);
      ctx.fillStyle = sel ? '#f6fbff' : '#d3e2f8';
      ctx.fillText(label, x, y);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawScene(t) {
    drawBackground(t);
    projectAll();
    drawLinks();
    drawNodes(t);
    drawLabels(t);
  }

  function updateCamera(dt, now) {
    var k = 1 - Math.exp(-Math.min(dt, 0.05) * 7);
    if (!cam.dragging) {
      if (!REDUCED && !state.selectedId && !state.searchQuery && state.nodes.length && now - cam.lastInput > 6500) {
        cam.tYaw += dt * 0.045;
      }
      cam.yaw += (cam.tYaw - cam.yaw) * k;
      cam.pitch += (cam.tPitch - cam.pitch) * k;
      cam.zoom += (cam.tZoom - cam.zoom) * k;
    } else {
      cam.zoom += (cam.tZoom - cam.zoom) * k;
    }
  }

  var lastFrame = 0;
  var elapsed = 0;

  function frame(now) {
    var dt = lastFrame ? Math.min(0.06, Math.max(0, (now - lastFrame) / 1000)) : 0;
    lastFrame = now;
    elapsed += dt;
    if (!document.hidden) {
      updateCamera(dt, now);
      drawScene(elapsed);
      state.frameCount++;
      state.lastFrameAt = now;
    }
    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ */
  /* interaction                                                        */
  /* ------------------------------------------------------------------ */

  function pickNode(mx, my) {
    var best = null;
    for (var i = 0; i < state.nodes.length; i++) {
      var n = state.nodes[i];
      if (!n._vis || !n._shown) continue;
      var dx = mx - n._sx;
      var dy = my - n._sy;
      var r = Math.max(9, n._r + 6);
      if (dx * dx + dy * dy <= r * r) {
        if (!best || n._z > best._z) best = n;
      }
    }
    return best;
  }

  function showTip(node) {
    dom.nodeTip.textContent = '';
    var head = make('div', 'tip-k');
    head.style.setProperty('--c', kindDef(node.kind).color);
    head.appendChild(make('i'));
    head.appendChild(document.createTextNode(kindDef(node.kind).label + ' · 重要度 ' + pct(node.importance) + '%'));
    dom.nodeTip.appendChild(head);
    dom.nodeTip.appendChild(make('div', 'tip-t', shortText(node.text, 90)));
    dom.nodeTip.hidden = false;
  }

  function positionTip(x, y) {
    var maxX = view.desktop ? view.panelLeft - 292 : view.w - 292;
    var left = clamp(x, 10, Math.max(10, maxX));
    var top = clamp(y, 74, Math.max(74, view.h - 40));
    dom.nodeTip.style.left = Math.round(left) + 'px';
    dom.nodeTip.style.top = Math.round(top) + 'px';
  }

  function hideTip() {
    dom.nodeTip.hidden = true;
  }

  function updateHover(e) {
    var node = pickNode(e.clientX, e.clientY);
    var id = node ? node.id : null;
    if (id !== state.hoverId) {
      state.hoverId = id;
      if (node) showTip(node);
      else hideTip();
    }
    if (node) positionTip(e.clientX, e.clientY);
    dom.canvas.style.cursor = node ? 'pointer' : 'grab';
  }

  function onPointerDown(e) {
    if (e.button !== 0 || e.isPrimary === false) return;
    drag = {
      id: e.pointerId, x: e.clientX, y: e.clientY,
      sx: e.clientX, sy: e.clientY, moved: 0, at: performance.now()
    };
    cam.dragging = true;
    cam.lastInput = performance.now();
    document.body.classList.add('dragging');
    hideTip();
    try { dom.canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (drag && e.pointerId === drag.id) {
      var dx = e.clientX - drag.x;
      var dy = e.clientY - drag.y;
      drag.x = e.clientX;
      drag.y = e.clientY;
      drag.moved += Math.abs(dx) + Math.abs(dy);
      cam.yaw -= dx * 0.0055;
      cam.tYaw = cam.yaw;
      cam.pitch = clamp(cam.pitch + dy * 0.0045, -1.35, 1.35);
      cam.tPitch = cam.pitch;
      cam.lastInput = performance.now();
      return;
    }
    if (e.pointerType === 'mouse') updateHover(e);
  }

  function endDrag(e, cancelled) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    var wasClick = !cancelled && drag.moved < 5 && performance.now() - drag.at < 520;
    try { dom.canvas.releasePointerCapture(drag.id); } catch (err) {}
    drag = null;
    cam.dragging = false;
    document.body.classList.remove('dragging');
    cam.tYaw = cam.yaw;
    cam.tPitch = cam.pitch;
    if (wasClick && e) {
      var node = pickNode(e.clientX, e.clientY);
      if (node) selectNode(node.id, false);
      else clearSelection();
    }
  }

  function onWheel(e) {
    e.preventDefault();
    var dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 16;
    else if (e.deltaMode === 2) dy *= 100;
    cam.tZoom = clamp(cam.tZoom * Math.exp(-dy * 0.0012), 0.45, 3.2);
    cam.lastInput = performance.now();
  }

  function onDblClick(e) {
    var node = pickNode(e.clientX, e.clientY);
    if (node) {
      selectNode(node.id, true);
    } else {
      cam.tYaw = 0.62;
      cam.tPitch = 0.2;
      cam.tZoom = 1;
      cam.lastInput = performance.now();
    }
  }

  function saveToken() {
    var t = dom.tokenInput.value.trim();
    if (!t) {
      dom.loginHint.textContent = '令牌不能为空。';
      dom.tokenInput.focus();
      return;
    }
    try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {}
    state.token = t;
    hideLogin();
    toast('令牌已保存，正在读取星图…');
    loadAll(true);
  }

  function bindEvents() {
    dom.refreshBtn.addEventListener('click', function () { loadAll(true); });
    dom.apiState.addEventListener('click', function () {
      if (state.status === 'auth') showLogin('接口返回 401：令牌缺失或已失效。');
    });
    dom.panelClose.addEventListener('click', clearSelection);
    dom.loginClose.addEventListener('click', hideLogin);
    dom.loginModal.addEventListener('click', function (e) { if (e.target === dom.loginModal) hideLogin(); });
    dom.tokenSave.addEventListener('click', saveToken);
    dom.tokenInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); saveToken(); }
    });
    dom.emptyCta.addEventListener('click', function (e) {
      if (dom.emptyCta.dataset.mode === 'retry') {
        e.preventDefault();
        loadAll(true);
      }
    });
    dom.filterBar.addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (chip) applyFilter(chip.dataset.kind);
    });
    dom.panelBody.addEventListener('click', function (e) {
      var item = e.target.closest('.related-item');
      if (item) selectNode(item.dataset.id, true);
    });
    dom.searchInput.addEventListener('input', function () {
      state.srIndex = -1;
      applySearch(dom.searchInput.value.trim(), { fly: true });
    });
    dom.searchInput.addEventListener('focus', function () {
      if (state.searchQuery) renderSearchResults();
    });
    dom.searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!state.searchList.length) return;
        e.preventDefault();
        if (e.key === 'ArrowDown') state.srIndex = Math.min(state.searchList.length - 1, state.srIndex + 1);
        else state.srIndex = Math.max(0, state.srIndex - 1);
        renderSearchResults();
        var active = dom.searchResults.querySelector('.sr-item.active');
        if (active) active.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        if (!state.searchList.length) return;
        e.preventDefault();
        chooseSearchResult(state.srIndex >= 0 ? state.srIndex : 0);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        clearSearch();
        dom.searchInput.blur();
      }
    });
    dom.searchResults.addEventListener('click', function (e) {
      var item = e.target.closest('.sr-item');
      if (!item) return;
      var node = state.nodeById.get(item.dataset.id);
      if (node) {
        selectNode(node.id, true);
        hideSearchResults();
      }
    });
    document.addEventListener('pointerdown', function (e) {
      if (!dom.searchBox.contains(e.target)) hideSearchResults();
    }, true);
    dom.searchBox.addEventListener('focusout', function () {
      setTimeout(function () {
        if (!dom.searchBox.contains(document.activeElement)) hideSearchResults();
      }, 90);
    });
    document.addEventListener('keydown', function (e) {
      var tag = document.activeElement && document.activeElement.tagName;
      var typing = tag === 'INPUT' || tag === 'TEXTAREA';
      if (e.key === 'Escape') {
        if (!dom.loginModal.hidden) { hideLogin(); return; }
        if (!dom.searchResults.hidden) { hideSearchResults(); return; }
        if (state.selectedId) { clearSelection(); return; }
        if (typing) { dom.searchInput.blur(); return; }
      }
      if (e.key === '/' && !typing && dom.loginModal.hidden) {
        e.preventDefault();
        dom.searchInput.focus();
        dom.searchInput.select();
        return;
      }
      if ((e.key === 'r' || e.key === 'R') && !typing && !e.ctrlKey && !e.metaKey && !e.altKey && dom.loginModal.hidden) {
        e.preventDefault();
        loadAll(true);
      }
    });
    dom.canvas.addEventListener('pointerdown', onPointerDown);
    dom.canvas.addEventListener('pointermove', onPointerMove);
    dom.canvas.addEventListener('pointerup', function (e) { endDrag(e, false); });
    dom.canvas.addEventListener('pointercancel', function (e) { endDrag(e, true); });
    dom.canvas.addEventListener('pointerleave', function () {
      if (!drag) {
        state.hoverId = null;
        hideTip();
        dom.canvas.style.cursor = 'grab';
      }
    });
    dom.canvas.addEventListener('wheel', onWheel, { passive: false });
    dom.canvas.addEventListener('dblclick', onDblClick);
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 120);
    });
    window.addEventListener('orientationchange', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 160);
    });
  }

  /* ------------------------------------------------------------------ */
  /* init                                                               */
  /* ------------------------------------------------------------------ */

  function installDebug() {
    if (!DEBUG) return;
    window.__galaxy = {
      get nodes() {
        return state.nodes.map(function (n) {
          return {
            id: n.id, kind: n.kind, text: n.text, x: n.x, y: n.y, z: n.z,
            importance: n.importance, valence: n.valence, arousal: n.arousal,
            accessCount: n.accessCount, shown: n._shown, vis: n._vis,
            sx: n._sx, sy: n._sy, r: n._r, depth: n._z
          };
        });
      },
      get selectedId() { return state.selectedId; },
      get selectedText() {
        var n = state.selectedId ? state.nodeById.get(state.selectedId) : null;
        return n ? n.text : null;
      },
      get searchQuery() { return state.searchQuery; },
      get matches() { return state.matches.size; },
      get searchList() { return state.searchList.map(function (n) { return n.id; }); },
      get camera() { return { yaw: cam.yaw, pitch: cam.pitch, zoom: cam.zoom, tYaw: cam.tYaw, tZoom: cam.tZoom }; },
      get viewport() { return { w: view.w, h: view.h, dpr: view.dpr, cx: view.cx, cy: view.cy, panelLeft: view.panelLeft }; },
      get status() { return state.status; },
      get meta() { return state.meta; },
      get emotion() { return state.emotion; },
      get counts() { return { nodes: state.nodes.length, links: state.links.length, visible: visibleNodes().length }; },
      select: function (id) { selectNode(id, true); },
      focus: function (id) {
        var n = state.nodeById.get(String(id));
        if (n) focusOnNode(n, { zoom: 1.35 });
      },
      clear: clearSelection,
      search: function (q) {
        dom.searchInput.focus();
        dom.searchInput.value = q;
        applySearch(q, { fly: true });
      },
      reload: function () { return loadAll(true); }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 立绘：可以拖到任意位置（位置存 localStorage，双击回原位）            */
  /* ------------------------------------------------------------------ */
  var MASCOT_POS_KEY = 'galaxy.mascot.pos.v1';
  var mascotBox = null;

  // 注意：position:fixed 的元素 offsetParent 恒为 null，判断可见性不能用它（要用 display）
  function mascotShown() {
    return !!dom.mascot && getComputedStyle(dom.mascot).display !== 'none';
  }

  function measureMascot() {
    mascotBox = null;
    if (!mascotShown()) return;
    var r = dom.mascot.getBoundingClientRect();
    if (r.width > 1 && r.height > 1) mascotBox = { left: r.left, right: r.right, top: r.top, bottom: r.bottom };
  }

  function mascotTopLimit() {
    var top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--top-h'));
    return (isFinite(top) ? top : 64) + 8;
  }

  function clampMascot(x, y) {
    var w = dom.mascot.offsetWidth || 160;
    var h = dom.mascot.offsetHeight || 210;
    var minTop = mascotTopLimit();
    var maxLeft = Math.max(6, window.innerWidth - w - 6);
    var maxTop = Math.max(minTop, window.innerHeight - h - 6);
    return { x: Math.min(maxLeft, Math.max(6, x)), y: Math.min(maxTop, Math.max(minTop, y)) };
  }

  function syncMascotReset() {
    if (!dom.mascotReset) return;
    var moved = !!dom.mascot && dom.mascot.classList.contains('placed');
    dom.mascotReset.hidden = !(moved && mascotShown());
  }

  function placeMascot(x, y) {
    dom.mascot.classList.add('placed');
    dom.mascot.style.left = Math.round(x) + 'px';
    dom.mascot.style.top = Math.round(y) + 'px';
    measureMascot();
    syncMascotReset();
  }

  // 复位到默认位置（底部居中）：清掉存的位置与内联 left/top
  function resetMascot() {
    try { localStorage.removeItem(MASCOT_POS_KEY); } catch (err) {}
    restoreMascot();
  }

  function restoreMascot() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(MASCOT_POS_KEY) || 'null'); } catch (err) { saved = null; }
    if (saved && isFinite(saved.x) && isFinite(saved.y)) {
      var c = clampMascot(Number(saved.x), Number(saved.y));
      placeMascot(c.x, c.y);
      return;
    }
    dom.mascot.classList.remove('placed');
    dom.mascot.style.left = '';
    dom.mascot.style.top = '';
    measureMascot();
    syncMascotReset();
  }

  function saveMascotPos() {
    var r = dom.mascot.getBoundingClientRect();
    try { localStorage.setItem(MASCOT_POS_KEY, JSON.stringify({ x: Math.round(r.left), y: Math.round(r.top) })); } catch (err) {}
  }

  function installMascotDrag() {
    if (!dom.mascot) return;
    restoreMascot();
    var drag = null;
    dom.mascot.addEventListener('pointerdown', function (e) {
      if (e.button && e.button !== 0) return;
      var r = dom.mascot.getBoundingClientRect();
      drag = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, moved: false };
      dom.mascot.classList.add('dragging');
      try { dom.mascot.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    dom.mascot.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      drag.moved = true;
      var c = clampMascot(e.clientX - drag.dx, e.clientY - drag.dy);
      placeMascot(c.x, c.y);
      e.preventDefault();
    });
    function endDrag(e) {
      if (!drag || e.pointerId !== drag.id) return;
      try { dom.mascot.releasePointerCapture(drag.id); } catch (err) {}
      dom.mascot.classList.remove('dragging');
      if (drag.moved) saveMascotPos();
      drag = null;
    }
    dom.mascot.addEventListener('pointerup', endDrag);
    dom.mascot.addEventListener('pointercancel', endDrag);
    dom.mascot.addEventListener('dragstart', function (e) { e.preventDefault(); });
    dom.mascot.addEventListener('dblclick', function (e) {
      e.preventDefault();
      resetMascot();
    });
    if (dom.mascotReset) dom.mascotReset.addEventListener('click', function (e) {
      e.preventDefault();
      resetMascot();
    });
    syncMascotReset();
  }

  function init() {
    bindEvents();
    resize();
    installMascotDrag();
    buildSprites();
    rebuildFilters();
    updateCounts();
    updateEmpty();
    renderPanel();
    installDebug();
    lastFrame = performance.now();
    requestAnimationFrame(frame);
    loadAll(false);
  }

  init();
})();
</script>
</body>
</html>
